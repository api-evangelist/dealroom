      type: object
      properties:
        id:
          type: number
          description: Stable Dealroom transaction ID.
          example: 12345
        amount:
          type:
          - number
          - 'null'
          description: Round amount in the active currency, as a whole-unit integer.
          example: 5000000
        announced_date:
          anyOf:
          - $ref: '#/components/schemas/PartialDate'
          - type: 'null'
          description: When the round was announced, at source precision.
          example: 2024-03
        round_type:
          type:
          - string
          - 'null'
          description: Raw reported round type (e.g. `SEED`, `SERIES A`, `EARLY VC`, `GRANT`). For the normalised stage, use `standardized_round`. See the [Filters reference](/references/filters-and-sorting) for the complete enum.
          example: SERIES B
        standardized_round:
          anyOf:
          - $ref: '#/components/schemas/StandardizedRound'
          - type: 'null'
          description: Normalised round stage — one of `Pre-Seed`, `Seed`, `Series A`–`Series E`, `Series F+`, `Growth`, `Bridge`, `Debt`, `Grant`, `IPO`, `Secondary`, `Other`. This is the value the `standardized_round` filter matches.
          example: Series B
        valuation:
          type:
          - number
          - 'null'
          description: Post-money valuation in the active currency at the time of this round, as a whole-unit integer. Null when the valuation was not disclosed.
          example: 5000000000
        is_verified:
          type:
          - boolean
          - 'null'
          description: Whether the round has been verified by Dealroom.
          example: true
        is_vc_round:
          type:
          - boolean
          - 'null'
          description: Whether the round is a venture-capital round.
          example: true
        is_exit:
          type:
          - boolean
          - 'null'
          description: Whether the transaction represents an exit (e.g. IPO, acquisition).
          example: false
        company:
          $ref: '#/components/schemas/OrganizationSummary'
        investors:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              is_lead:
                type:
                - boolean
                - 'null'
                description: Whether this investor led the round, when known.
                example: true
              investor:
                $ref: '#/components/schemas/EntityRef'
            required:
            - is_lead
            - investor
          description: Participating investors, leads first. `null` for callers without the premium tier.
        source_url:
          type:
          - string
          - 'null'
          description: URL of the news article or press release that is the source for this round. Null when no source is recorded.
          example: https://techcrunch.com/2024/03/21/acme-raises-series-b
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 timestamp when this record was soft-deleted (null = active)
          example: null
      required:
      - id
      - amount
      - announced_date
      - round_type
      - standardized_round
      - valuation
      - is_verified
      - is_vc_round
      - is_exit
      - company
      - investors
      - source_url
      - deleted_at
