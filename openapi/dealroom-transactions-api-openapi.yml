openapi: 3.2.0
info:
  title: Dealroom Transactions API
  version: '2026-10-09'
  description: REST API for the Dealroom platform — companies, funds, founders, investors, funding rounds, valuations, taxonomy, news, and aggregate analytics across all of them. Authentication uses Auth0 (Bearer JWT or OAuth2 client_credentials). All endpoints are versioned via the `API-Version` header (Stripe-style date-based versioning).
  contact:
    name: Dealroom API support
    email: support@dealroom.co
    url: https://dealroom.co
  termsOfService: https://dealroom.co/terms
  license:
    name: Proprietary — Dealroom commercial license
    url: https://dealroom.co/terms
servers:
- url: https://api.dealroom.app
  description: Production
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Transactions
  description: Funding rounds, equity events, debt, grants, exits, and other company-level financial events.
paths:
  /data/transactions:
    get:
      operationId: listTransactions
      security:
      - oauth2:
        - read:transactions
      - bearerAuth:
        - read:transactions
      tags:
      - Transactions
      summary: List transactions
      description: Lists company funding-related transactions (rounds, equity events, debt, grants). Supports the structured filter expression syntax shared with `/data/entities` and the same `limit` / `offset` / `sort` / `include_total` pagination model.
      parameters:
      - schema:
          type: string
          description: 'Filter expression for transactions.


            Examples:

            - Single: date[gte]:2020

            - AND: and(date[gte]:2020,amount[gte]:1000000)

            - OR: or(round_type[eq]:seed,round_type[eq]:series_a)


            Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

            in_all / nin_all are available on repeated related-record filters and on the classification / roles flag sets.

            Default ref: ''funding''

            '
          example: and(date[gte]:2020,amount[gte]:1000000)
        required: false
        description: 'Filter expression for transactions.


          Examples:

          - Single: date[gte]:2020

          - AND: and(date[gte]:2020,amount[gte]:1000000)

          - OR: or(round_type[eq]:seed,round_type[eq]:series_a)


          Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

          in_all / nin_all are available on repeated related-record filters and on the classification / roles flag sets.

          Default ref: ''funding''

          '
        name: filter
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2000
          default: 25
          description: Number of results to return (1-2000, default 25)
          example: 25
        required: false
        description: Number of results to return (1-2000, default 25)
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
          example: eyJ2IjoxLCJkIjoibmV4dCJ9
        required: false
        description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
        name: cursor
        in: query
      - schema:
          type: string
          pattern: ^(?:-?\w+)?(?:,(?:-?\w+)?)*$
          description: Sort by one or more keys. Prefix with `-` for descending order; comma-separated for multi-key sorts.
          example: -date
        required: false
        description: Sort by one or more keys. Prefix with `-` for descending order; comma-separated for multi-key sorts.
        name: sort
        in: query
      - schema:
          type: boolean
          description: Pass `true` to compute `page.total` (the matching record count). By default no count query runs and `page.total` is `null`.
          example: true
        required: false
        description: Pass `true` to compute `page.total` (the matching record count). By default no count query runs and `page.total` is `null`.
        name: include_total
        in: query
      - schema:
          type: string
          description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
          example: EUR
        required: false
        description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
        name: currency
        in: query
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request was malformed or failed validation.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '401':
          description: Authentication required. The `Authorization` header was missing, the bearer token was malformed, or the token failed signature / expiry validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required — provide a valid bearer token.
                  details: null
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '402':
          description: '`CREDITS_EXHAUSTED` — the caller''s team has no credits left, or none granted yet. Only API-key and MCP requests are capped.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
        '403':
          description: Authentication succeeded but the caller's token does not include the permission required for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '429':
          description: Rate limit exceeded.
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying.
                example: '1'
              required: true
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded — retry after the delay in the `Retry-After` header.
                  details: null
        '503':
          description: '`SERVICE_UNAVAILABLE` — the caller''s team credits could not be checked. Retry shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is temporarily unavailable.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
  /data/transactions/{id}:
    get:
      operationId: getTransaction
      security:
      - oauth2:
        - read:transactions
      - bearerAuth:
        - read:transactions
      tags:
      - Transactions
      summary: Get single transaction
      description: Returns one funding-related transaction by its stable Dealroom id — the same row `GET /data/transactions` returns, so list and detail share one shape. Soft-deleted transactions are not found.
      parameters:
      - schema:
          type: string
          minLength: 1
          example: '12345'
          description: Numeric Dealroom transaction (funding round) ID.
        required: true
        description: Numeric Dealroom transaction (funding round) ID.
        name: id
        in: path
      - schema:
          type: string
          description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
          example: EUR
        required: false
        description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
        name: currency
        in: query
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Single transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          description: Invalid transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request was malformed or failed validation.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '401':
          description: Authentication required. The `Authorization` header was missing, the bearer token was malformed, or the token failed signature / expiry validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required — provide a valid bearer token.
                  details: null
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '402':
          description: '`CREDITS_EXHAUSTED` — the caller''s team has no credits left, or none granted yet. Only API-key and MCP requests are capped.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
        '403':
          description: Authentication succeeded but the caller's token does not include the permission required for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: The requested resource was not found.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '429':
          description: Rate limit exceeded.
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying.
                example: '1'
              required: true
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded — retry after the delay in the `Retry-After` header.
                  details: null
        '503':
          description: '`SERVICE_UNAVAILABLE` — the caller''s team credits could not be checked. Retry shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is temporarily unavailable.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
components:
  headers:
    Sunset:
      description: 'Present when the request pinned a superseded version: the date the version stops working and requests begin returning `400` (`YYYY-MM-DD`).'
      schema:
        type: string
        format: date
    Deprecation:
      description: 'Present when the request pinned a superseded version: the date that version was deprecated (`YYYY-MM-DD`).'
      schema:
        type: string
        format: date
    X-Credits-Used:
      description: Credits this request consumed, under the current credit schedule. Present on every response to an API-key request under `/data`, `/analytics` and `/reference`; `0` on an error response or a free endpoint. Absent when the request was not authenticated with an API key (so never on a `401`), or on unmetered endpoints. During open beta credits are drawn from the team's balance but not billed.
      schema:
        type: integer
        minimum: 0
      example: 25
  schemas:
    CappedPaginationPage:
      type: object
      properties:
        total:
          type:
          - number
          - 'null'
        limit:
          type: number
        offset:
          type: number
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page. Null when no further pages exist.
        prev_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the previous page. Null when on the first page.
        capped:
          type: boolean
          description: True when the requested page size was reduced to the per-tier/ecosystem row cap.
        tier:
          $ref: '#/components/schemas/AccessTier'
        ecosystem:
          type:
          - string
          - 'null'
          description: Slug of the active ecosystem subdomain, or null when none is in scope.
      required:
      - total
      - limit
      - offset
      - next_cursor
      - prev_cursor
      - capped
      - tier
      - ecosystem
    GovNgoSummary:
      type: object
      properties:
        uuid:
          type: string
          description: Stable UUID of the entity; the sole public identifier.
          example: 345d1ab6-33df-4759-9e17-0d0c0ec9ab1c
        type:
          type: string
          enum:
          - organization
          description: Top-level entity type — exactly one of `organization` or `person`. For organizations, `subtype` carries the specific kind (company / university / gov_ngo / investor). Persons always have a null `subtype`.
        domain:
          type:
          - string
          - 'null'
          description: Registrable domain, e.g. "stripe.com".
          example: stripe.com
        name:
          type: string
          description: Display name.
          example: Stripe
        tagline:
          type:
          - string
          - 'null'
          description: One-line description.
        about:
          type:
          - string
          - 'null'
          description: Long-form description.
        image:
          type:
          - string
          - 'null'
          description: Absolute logo URL.
        dealroom_url:
          type:
          - string
          - 'null'
          description: Canonical profile URL on app.dealroom.co.
        links:
          type: object
          properties:
            website:
              type:
              - string
              - 'null'
              description: Website URL.
            linkedin:
              type:
              - string
              - 'null'
              description: LinkedIn profile URL.
            twitter:
              type:
              - string
              - 'null'
              description: Twitter / X profile URL.
            instagram:
              type:
              - string
              - 'null'
              description: Instagram URL or handle.
            angellist:
              type:
              - string
              - 'null'
              description: AngelList URL or handle.
            crunchbase:
              type:
              - string
              - 'null'
              description: Crunchbase profile URL.
          required:
          - website
          - linkedin
          - twitter
          - instagram
          - angellist
          - crunchbase
          description: The entity's own presence on the web; each null when unknown.
        locations:
          type: array
          items:
            type: object
            properties:
              role:
                $ref: '#/components/schemas/LocationRole'
              city:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: City; null when not known.
              state:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: State or region; null when none.
              country:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: Country.
              continent:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: Continent.
              lat:
                type:
                - number
                - 'null'
                description: Entity coordinates when known, otherwise the city centroid.
              lon:
                type:
                - number
                - 'null'
                description: Entity coordinates when known, otherwise the city centroid.
            required:
            - role
            - city
            - state
            - country
            - continent
            - lat
            - lon
          description: 'Every location: hq, founding, then offices; empty when none.'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EntityRole'
          description: 'Roles the organization plays: `investor`, `limited_partner`, `fund_manager`.'
        taxonomy:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                description: Numeric identifier of the tag.
              name:
                type: string
                description: Display name of the tag.
              type:
                $ref: '#/components/schemas/TagType'
            required:
            - id
            - name
            - type
          description: Taxonomy terms (industries, sectors, technologies, …); empty when none.
        launch_date:
          anyOf:
          - $ref: '#/components/schemas/PartialDate'
          - type: 'null'
          description: When the organization was founded, at source precision.
        closing_date:
          anyOf:
          - $ref: '#/components/schemas/PartialDate'
          - type: 'null'
          description: When the organization closed; null while active.
        employees_count:
          type:
          - number
          - 'null'
          description: Number of employees.
        added_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the organization was added to Dealroom (RFC 3339).
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the record was last modified (RFC 3339).
        subtype:
          type: string
          enum:
          - gov_ngo
          description: Organization subtype — one of `company`, `university`, `gov_ngo`, `investor`. Mutually exclusive. Always null for persons.
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/Classification'
          description: Dealroom labels; empty when none.
        signal_rating:
          type:
          - number
          - 'null'
          description: Dealroom Signal rating (0-100).
        investor:
          type:
          - object
          - 'null'
          properties:
            types:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                    description: Tag id.
                  name:
                    type: string
                    description: Display name.
                  code:
                    type: string
                    description: Machine-readable code.
                required:
                - id
                - name
                - code
              description: Investor types; empty when none.
            stages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                    description: Tag id.
                  name:
                    type: string
                    description: Display name.
                  code:
                    type: string
                    description: Machine-readable code.
                required:
                - id
                - name
                - code
              description: Stages invested in; empty when none.
            deal_size:
              type:
              - object
              - 'null'
              properties:
                min:
                  type:
                  - number
                  - 'null'
                  description: Smallest ticket, active currency.
                max:
                  type:
                  - number
                  - 'null'
                  description: Largest ticket, active currency.
              required:
              - min
              - max
              description: Ticket size range; null when unknown.
            investments:
              type: object
              properties:
                count:
                  type:
                  - number
                  - 'null'
                  description: Investments made.
                total_invested:
                  type:
                  - number
                  - 'null'
                  description: Total size of the funding rounds the investor participated in (the full round amounts, not the investor's own ticket), active currency.
                preferred_round:
                  type:
                  - string
                  - 'null'
                  description: Most frequent round stage, e.g. `series_a`.
                last_round_date:
                  anyOf:
                  - $ref: '#/components/schemas/PartialDate'
                  - type: 'null'
                  description: Date of the most recent investment round, at source precision.
              required:
              - count
              - total_invested
              - preferred_round
              - last_round_date
              description: Investment activity.
          required:
          - types
          - stages
          - deal_size
          - investments
          description: The organization's investing profile; null unless it invests.
        funding:
          type:
          - object
          - 'null'
          properties:
            total:
              type:
              - number
              - 'null'
              description: Total raised, active currency.
            total_vc:
              type:
              - number
              - 'null'
              description: VC-only share of `total`.
            rounds_count:
              type:
              - number
              - 'null'
              description: Funding rounds recorded.
          required:
          - total
          - total_vc
          - rounds_count
          description: Funding raised; null when no round is recorded.
        jobs:
          type: object
          properties:
            is_hiring:
              type:
              - boolean
              - 'null'
              description: Currently recruiting.
            open_count:
              type: number
              description: Active job openings; 0 when none.
          required:
          - is_hiring
          - open_count
          description: Hiring status and open roles.
      required:
      - uuid
      - type
      - domain
      - name
      - tagline
      - about
      - image
      - dealroom_url
      - links
      - locations
      - roles
      - taxonomy
      - launch_date
      - closing_date
      - employees_count
      - added_at
      - updated_at
      - subtype
      - classifications
      - signal_rating
      - investor
      - funding
      - jobs
      title: Government & NGO
      description: 'An entity as it appears on another row: its type''s row without the full-only blocks.'
    Classification:
      type: string
      enum:
      - startup
      - colt
      - titan
      - rising_star
      - spinout
      - thoroughbred
      - unicorn
      - vc_backed
      - funded
      - exited
      - pe_owned
      - serial_founder
      - super_founder
      - promising_founder
      - strong_founder
      description: A Dealroom label. New values are added without a version change, so a client must tolerate a value it does not recognise.
    StandardizedRound:
      type: string
      enum:
      - Pre-Seed
      - Seed
      - Series A
      - Series B
      - Series C
      - Series D
      - Series E
      - Series F+
      - Growth
      - Bridge
      - Debt
      - Grant
      - IPO
      - Secondary
      - Other
      description: Normalised round stage, the value the `standardized_round` filter matches.
    EntityRole:
      type: string
      enum:
      - founder
      - executive
      - partner
      - investor
      - limited_partner
      - fund_manager
      description: 'A role the entity plays: person roles (founder, executive, partner, investor) and organization roles (investor, limited_partner, fund_manager).'
    TransactionDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Transaction'
        currency:
          type: string
      required:
      - data
      - currency
    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          $ref: '#/components/schemas/CappedPaginationPage'
        currency:
          type: string
      required:
      - data
      - page
      - currency
    OrganizationSummary:
      oneOf:
      - $ref: '#/components/schemas/CompanySummary'
      - $ref: '#/components/schemas/UniversitySummary'
      - $ref: '#/components/schemas/GovNgoSummary'
      - $ref: '#/components/schemas/InvestorSummary'
