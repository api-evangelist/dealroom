openapi: 3.2.0
info:
  title: Dealroom Companies API
  version: '2026-10-09'
  description: REST API for the Dealroom platform — companies, funds, founders, investors, funding rounds, valuations, taxonomy, news, and aggregate analytics across all of them. Authentication uses Auth0 (Bearer JWT or OAuth2 client_credentials). All endpoints are versioned via the `API-Version` header (Stripe-style date-based versioning).
  contact:
    name: Dealroom API support
    email: support@dealroom.co
    url: https://dealroom.co
  termsOfService: https://dealroom.co/terms
  license:
    name: Proprietary — Dealroom commercial license
    url: https://dealroom.co/terms
servers:
- url: https://api.dealroom.app
  description: Production
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Companies
  description: Company profiles — the `organization_subtype = company` subset of entities (excludes investors, universities, and gov/NGOs). Same response shape as the entity index, scoped to companies.
paths:
  /data/companies:
    get:
      operationId: listCompanies
      security:
      - oauth2:
        - read:entities
      - bearerAuth:
        - read:entities
      tags:
      - Companies
      summary: List companies
      description: Returns a paginated list of companies (entities with `organization_subtype = company`) — the subset of the entity index that excludes investors, universities, and gov/NGOs. Supports the full entity filter syntax, sorting, and pagination. Monetary fields convert to the requested `?currency=` (default USD).
      parameters:
      - schema:
          type: string
          description: 'Filter expression for companies (organization_subtype = company) using nested syntax.


            Examples:

            - Single: total_funding[gte]:1000000

            - AND: and(total_funding[gte]:1000000,classification[in_any]:unicorn)

            - OR: or(hq_location[eq]:628061,hq_location[eq]:1297711)

            - Relationship path: investor.total_invested_usd[gte]:100000000


            Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

            in_all / nin_all are available on repeated related-record filters and on the classification / roles flag sets.

            Default ref: ''entity'' (can be omitted for entity filters)

            '
          example: and(total_funding[gte]:1000000,classification[in_any]:unicorn)
        required: false
        description: 'Filter expression for companies (organization_subtype = company) using nested syntax.


          Examples:

          - Single: total_funding[gte]:1000000

          - AND: and(total_funding[gte]:1000000,classification[in_any]:unicorn)

          - OR: or(hq_location[eq]:628061,hq_location[eq]:1297711)

          - Relationship path: investor.total_invested_usd[gte]:100000000


          Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

          in_all / nin_all are available on repeated related-record filters and on the classification / roles flag sets.

          Default ref: ''entity'' (can be omitted for entity filters)

          '
        name: filter
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 25
          description: Number of results to return (1-500, default 25)
          example: 25
        required: false
        description: Number of results to return (1-500, default 25)
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
          example: eyJ2IjoxLCJkIjoibmV4dCJ9
        required: false
        description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
        name: cursor
        in: query
      - schema:
          type: string
          pattern: ^(?:-?\w+)?(?:,(?:-?\w+)?)*$
          description: Sort by one or more keys. Prefix with `-` for descending order; comma-separated for multi-key sorts.
          example: -launch_date
        required: false
        description: Sort by one or more keys. Prefix with `-` for descending order; comma-separated for multi-key sorts.
        name: sort
        in: query
      - schema:
          type: boolean
          description: Pass `true` to compute `page.total` (the matching record count). By default no count query runs and `page.total` is `null`.
          example: true
        required: false
        description: Pass `true` to compute `page.total` (the matching record count). By default no count query runs and `page.total` is `null`.
        name: include_total
        in: query
      - schema:
          type: string
          description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
          example: EUR
        required: false
        description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
        name: currency
        in: query
      - schema:
          type: string
          enum:
          - full
          - summary
          default: full
          description: Which row shape to return, echoed as `view` in the response. `full` is the complete row, priced as a full record. `summary` drops the full-only blocks (founders, revenue, traffic, patents, alumni, founded_companies, career, education, portfolio, exits, match, rank) and is priced as a summary record.
          example: summary
        required: false
        description: Which row shape to return, echoed as `view` in the response. `full` is the complete row, priced as a full record. `summary` drops the full-only blocks (founders, revenue, traffic, patents, alumni, founded_companies, career, education, portfolio, exits, match, rank) and is priced as a summary record.
        name: view
        in: query
