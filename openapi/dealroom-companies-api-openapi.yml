          format: uuid
          example: 345d1ab6-33df-4759-9e17-0d0c0ec9ab1c
          description: Stable UUID of the entity. Numeric ids are not accepted.
        required: true
        description: Stable UUID of the entity. Numeric ids are not accepted.
        name: id
        in: path
      - schema:
          type: string
          description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
          example: EUR
        required: false
        description: ISO 4217 currency code for monetary field conversion. Defaults to USD.
        name: currency
        in: query
