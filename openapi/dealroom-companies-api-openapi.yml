                  id:
                    type: number
                    description: Tag id.
                  name:
                    type: string
                    description: Display name.
                  code:
                    type: string
                    description: Machine-readable code.
                required:
                - id
                - name
                - code
              description: Investor types; empty when none.
            stages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                    description: Tag id.
                  name:
                    type: string
                    description: Display name.
                  code:
                    type: string
                    description: Machine-readable code.
                required:
                - id
                - name
                - code
              description: Stages invested in; empty when none.
            deal_size:
              type:
              - object
              - 'null'
              properties:
                min:
                  type:
                  - number
                  - 'null'
                  description: Smallest ticket, active currency.
                max:
                  type:
                  - number
                  - 'null'
                  description: Largest ticket, active currency.
              required:
              - min
              - max
              description: Ticket size range; null when unknown.
            investments:
              type: object
              properties:
                count:
                  type:
                  - number
                  - 'null'
                  description: Investments made.
                total_invested:
                  type:
                  - number
                  - 'null'
                  description: Total size of the funding rounds the investor participated in (the full round amounts, not the investor's own ticket), active currency.
                preferred_round:
                  type:
                  - string
                  - 'null'
                  description: Most frequent round stage, e.g. `series_a`.
                last_round_date:
                  anyOf:
                  - $ref: '#/components/schemas/PartialDate'
                  - type: 'null'
                  description: Date of the most recent investment round, at source precision.
              required:
              - count
              - total_invested
              - preferred_round
              - last_round_date
              description: Investment activity.
          required:
          - types
          - stages
          - deal_size
          - investments
          description: The organization's investing profile; null unless it invests.
        funding:
          type:
          - object
          - 'null'
          properties:
            total:
              type:
              - number
              - 'null'
              description: Total raised, active currency.
            total_vc:
              type:
              - number
              - 'null'
              description: VC-only share of `total`.
            rounds_count:
              type:
              - number
              - 'null'
              description: Funding rounds recorded.
          required:
