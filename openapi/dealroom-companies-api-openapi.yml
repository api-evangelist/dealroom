  /data/companies/geo:
    get:
      operationId: listCompanyGeoPoints
      security:
      - oauth2:
        - read:entities
      - bearerAuth:
        - read:entities
      tags:
      - Companies
      summary: List company map points
      description: 'Slim company payload for map rendering (the startup map''s dot layer): one point per company with HQ coordinates and an optional `size_by` metric value. Accepts the same filter syntax as `/companies`. When `size_by` is set, points sort by that dimension descending, so a bounded page keeps the highest-value points; continue with `cursor` from `page.next_cursor`. Companies without usable HQ coordinates are omitted. Monetary values are USD. For per-area counts (the map''s choropleth layer), use the aggregate endpoint: GET /analytics/aggregate/companies?metric=count&group_by=map_area.'
      parameters:
      - schema:
          type: string
          description: Filter expression for companies — identical syntax and semantics to the `/companies` list filter.
          example: and(total_funding[gte]:1000000,classification[in_any]:unicorn)
        required: false
        description: Filter expression for companies — identical syntax and semantics to the `/companies` list filter.
        name: filter
        in: query
      - schema:
          type: string
          enum:
          - total_funding
          - employees_count
          - latest_valuation
          - total_invested
          - investments_count
          - alumni_count
          - alumni_founders_count
          description: Numeric dimension returned as each point's `value` (for proportional dot sizing). Monetary dimensions are USD. Also sorts the result descending, so a capped response keeps the highest-value points. Omitted → `value` is null and the default sort applies.
          example: total_funding
        required: false
        description: Numeric dimension returned as each point's `value` (for proportional dot sizing). Monetary dimensions are USD. Also sorts the result descending, so a capped response keeps the highest-value points. Omitted → `value` is null and the default sort applies.
        name: size_by
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          default: 5000
          description: Number of results to return (1-5000, default 5000)
          example: 5000
        required: false
        description: Number of results to return (1-5000, default 5000)
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
          example: eyJ2IjoxLCJkIjoibmV4dCJ9
        required: false
        description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
        name: cursor
        in: query
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Company map points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGeoResponse'
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request was malformed or failed validation.
                  details: null
          headers:
            X-Credits-Used:
              $ref: '#/components/headers/X-Credits-Used'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '401':
          description: Authentication required. The `Authorization` header was missing, the bearer token was malformed, or the token failed signature / expiry validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required — provide a valid bearer token.
                  details: null
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '402':
          description: '`CREDITS_EXHAUSTED` — the caller''s team has no credits left, or none granted yet. Only API-key and MCP requests are capped.'
          content:
