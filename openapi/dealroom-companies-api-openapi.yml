              type:
              - number
              - 'null'
              description: Latest valuation, active currency.
            year:
              type:
              - number
              - 'null'
              description: Year the valuation was recorded.
            month:
              type:
              - number
              - 'null'
              description: Month (1-12); null when unknown.
          required:
