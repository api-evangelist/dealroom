  /data/universities/geo:
    get:
      operationId: listUniversityGeoPoints
      security:
      - oauth2:
        - read:entities
      - bearerAuth:
        - read:entities
      tags:
      - Universities
      summary: List university map points
      description: 'Slim university payload for map rendering (the startup map''s dot layer): one point per university with HQ coordinates and an optional `size_by` metric value. Accepts the same filter syntax as `/universities`. When `size_by` is set, points sort by that dimension descending, so a bounded page keeps the highest-value points; continue with `cursor` from `page.next_cursor`. Universities without usable HQ coordinates are omitted. Monetary values are USD. For per-area counts (the map''s choropleth layer), use GET /analytics/aggregate/universities?metric=count&group_by=map_area.'
      parameters:
      - schema:
          type: string
          description: Filter expression for universities — identical syntax and semantics to the `/universities` list filter.
          example: and(alumni_founders_count[gte]:100,hq_location[eq]:233)
        required: false
        description: Filter expression for universities — identical syntax and semantics to the `/universities` list filter.
        name: filter
        in: query
      - schema:
          type: string
          enum:
          - total_funding
          - employees_count
          - latest_valuation
          - total_invested
          - investments_count
          - alumni_count
          - alumni_founders_count
          description: Numeric dimension returned as each point's `value` (for proportional dot sizing). Monetary dimensions are USD. Also sorts the result descending, so a capped response keeps the highest-value points. Omitted → `value` is null and the default sort applies.
          example: total_funding
        required: false
        description: Numeric dimension returned as each point's `value` (for proportional dot sizing). Monetary dimensions are USD. Also sorts the result descending, so a capped response keeps the highest-value points. Omitted → `value` is null and the default sort applies.
        name: size_by
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          default: 5000
          description: Number of results to return (1-5000, default 5000)
          example: 5000
        required: false
        description: Number of results to return (1-5000, default 5000)
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
