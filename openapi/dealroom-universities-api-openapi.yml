components:
  headers:
    Sunset:
      description: 'Present when the request pinned a superseded version: the date the version stops working and requests begin returning `400` (`YYYY-MM-DD`).'
      schema:
        type: string
        format: date
    X-Credits-Used:
      description: Credits this request consumed, under the current credit schedule. Present on every response to an API-key request under `/data`, `/analytics` and `/reference`; `0` on an error response or a free endpoint. Absent when the request was not authenticated with an API key (so never on a `401`), or on unmetered endpoints. During open beta credits are drawn from the team's balance but not billed.
      schema:
        type: integer
        minimum: 0
      example: 25
    Deprecation:
      description: 'Present when the request pinned a superseded version: the date that version was deprecated (`YYYY-MM-DD`).'
      schema:
        type: string
        format: date
  schemas:
    Classification:
      type: string
      enum:
      - startup
      - colt
      - titan
      - rising_star
      - spinout
      - thoroughbred
      - unicorn
      - vc_backed
      - funded
      - exited
      - pe_owned
      - serial_founder
      - super_founder
      - promising_founder
      - strong_founder
      description: A Dealroom label. New values are added without a version change, so a client must tolerate a value it does not recognise.
    EntityRole:
      type: string
      enum:
      - founder
      - executive
      - partner
      - investor
      - limited_partner
      - fund_manager
      description: 'A role the entity plays: person roles (founder, executive, partner, investor) and organization roles (investor, limited_partner, fund_manager).'
    UniversityGeoResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UniversityGeoPoint'
        page:
          type: object
          properties:
            total:
              type:
              - number
              - 'null'
            limit:
              type: number
            offset:
              type: number
            next_cursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the next page. Null when no further pages exist.
            prev_cursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the previous page. Null when on the first page.
          required:
          - total
          - limit
          - offset
          - next_cursor
          - prev_cursor
      required:
      - data
      - page
    UniversityListResponse:
      oneOf:
      - $ref: '#/components/schemas/UniversityListResponseFull'
      - $ref: '#/components/schemas/UniversityListResponseSummary'
      discriminator:
        propertyName: view
        mapping:
          full: '#/components/schemas/UniversityListResponseFull'
          summary: '#/components/schemas/UniversityListResponseSummary'
      description: 'Universities: full rows by default, summary rows with `view=summary`.'
      type: object
    PersonSummary:
      type: object
      properties:
        uuid:
          type: string
          description: Stable UUID of the entity; the sole public identifier.
          example: 345d1ab6-33df-4759-9e17-0d0c0ec9ab1c
        type:
          type: string
          enum:
          - person
          description: Top-level entity type — exactly one of `organization` or `person`. For organizations, `subtype` carries the specific kind (company / university / gov_ngo / investor). Persons always have a null `subtype`.
        subtype:
          type: 'null'
          description: Organization subtype — one of `company`, `university`, `gov_ngo`, `investor`. Mutually exclusive. Always null for persons.
          example: null
        name:
          type: string
          description: Display name.
          example: Patrick Collison
        tagline:
          type:
          - string
          - 'null'
          description: One-line description.
        about:
          type:
          - string
          - 'null'
          description: Long-form description.
        image:
          type:
          - string
          - 'null'
          description: Absolute profile image URL.
        dealroom_url:
          type:
          - string
          - 'null'
          description: Canonical profile URL on app.dealroom.co.
        links:
          type: object
          properties:
            linkedin:
              type:
              - string
              - 'null'
              description: LinkedIn profile URL.
            twitter:
              type:
              - string
              - 'null'
              description: Twitter / X profile URL.
            angellist:
              type:
              - string
              - 'null'
              description: AngelList URL or handle.
            crunchbase:
              type:
              - string
              - 'null'
              description: Crunchbase profile URL.
          required:
          - linkedin
          - twitter
          - angellist
          - crunchbase
          description: The person's own presence on the web; each null when unknown.
        locations:
          type: array
          items:
            type: object
            properties:
              role:
                $ref: '#/components/schemas/LocationRole'
              city:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: City; null when not known.
              state:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: State or region; null when none.
              country:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: Country.
              continent:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: number
                    description: Location id, as accepted by the location filters.
                  name:
                    type: string
                    description: Location name.
                required:
                - id
                - name
                description: Continent.
              lat:
                type:
                - number
                - 'null'
                description: Entity coordinates when known, otherwise the city centroid.
              lon:
                type:
                - number
                - 'null'
                description: Entity coordinates when known, otherwise the city centroid.
            required:
            - role
            - city
            - state
            - country
            - continent
            - lat
            - lon
          description: Where the person is based; empty when unknown.
        roles:
          type: array
