  /data/universities/{id}/team:
    get:
      operationId: universityTeam
      security:
      - oauth2:
        - read:entities
        - read:people
      - bearerAuth:
        - read:entities
        - read:people
      tags:
      - Universities
      summary: List university team members
      description: People associated with the university through the people_entities relationship. Supports the same person filter DSL as `/data/people`, plus `role` and `is_past` relationship filters.
      parameters:
      - schema:
          type: string
          minLength: 1
          format: uuid
          example: 345d1ab6-33df-4759-9e17-0d0c0ec9ab1c
          description: Stable UUID of the entity. Numeric ids are not accepted.
        required: true
        description: Stable UUID of the entity. Numeric ids are not accepted.
        name: id
        in: path
      - schema:
          type: string
          description: 'Filter expression for team members — same syntax and keys as /data/people.


            Examples:

            - Single: hq_location[eq]:233

            - AND: and(hq_location[eq]:233,gender[eq]:female)


            Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

            Default ref: ''entity''

            '
          example: gender[eq]:female
        required: false
        description: 'Filter expression for team members — same syntax and keys as /data/people.


          Examples:

          - Single: hq_location[eq]:233

          - AND: and(hq_location[eq]:233,gender[eq]:female)


          Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

          Default ref: ''entity''

          '
        name: filter
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 25
          description: Number of results to return (1-500, default 25)
          example: 25
        required: false
        description: Number of results to return (1-500, default 25)
        name: limit
        in: query
