  /data/founders/{id}/founded-companies:
    get:
      operationId: founderFoundedCompanies
      security:
      - oauth2:
        - read:founders
      - bearerAuth:
        - read:founders
      tags:
      - Founders
      summary: List founded companies
      description: The companies (and other organizations) this person founded — a preset over the person career relationship filtered to the founder role. Same row shape as `/data/people/{id}/career`, newest tenure first. Supports the same entity `?filter[...]` DSL as `/data/companies`.
      parameters:
      - schema:
          type: string
          minLength: 1
          format: uuid
          example: 345d1ab6-33df-4759-9e17-0d0c0ec9ab1c
          description: Stable UUID of the entity. Numeric ids are not accepted.
        required: true
        description: Stable UUID of the entity. Numeric ids are not accepted.
        name: id
        in: path
      - schema:
          type: string
          description: 'Filter expression for the founded organizations — same syntax and keys as /data/companies.


            Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

            Default ref: ''entity''

            '
          example: launch_date[gte]:2015
        required: false
        description: 'Filter expression for the founded organizations — same syntax and keys as /data/companies.


          Operators: eq, neq, gt, gte, lt, lte, in_any, nin_any

          Default ref: ''entity''

          '
        name: filter
        in: query
      - schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 25
          description: Number of results to return (1-500, default 25)
          example: 25
        required: false
        description: Number of results to return (1-500, default 25)
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque cursor token from a previous response's `page.next_cursor` or `page.prev_cursor`. Round-trip it as-is — do not decode or modify.
