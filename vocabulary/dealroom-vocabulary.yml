  terms:
  - term: Discovery
    definition: API root discovery and functional namespaces.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Entities
    definition: Companies, investors, people, universities, and other organisations. Filter, sort, and paginate the unified entity index. The
      term `investor` refers to the investment firm; `fund` refers to the capital vehicle it raises.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Companies
    definition: Company profiles — the `organization_subtype = company` subset of entities (excludes investors, universities, and gov/NGOs). Same
      response shape as the entity index, scoped to companies.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Universities
    definition: University profiles — the `organization_subtype = university` subset of entities. The `university` sub-object carries alumni metrics.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Government & NGO
    definition: Government bodies and NGOs — the `organization_subtype = gov_ngo` subset of entities.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Transactions
    definition: Funding rounds, equity events, debt, grants, exits, and other company-level financial events.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Valuations
    definition: Company valuation history, by `valued_date`.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Investors
    definition: Investor profiles (VCs, corporates, angels, family offices, governments). Subset of entities where `is_investor = true`. An investor
      is the firm that makes investments; the capital vehicles it raises are funds available via `/investors/{id}/funds`.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Funds
    definition: Funds — the capital vehicles investor firms raise (e.g. "Fund III", $200M, 2024). Browse/filter by manager, type, size, and vintage;
      each fund links to its manager (GP). Fund size (`amount`) converts to the requested `?currency=` (default USD); `amount_source` carries
      the original native-currency amount.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: People
    definition: Person profiles (founders, executives, angels, and others). Subset of entities where `entity_type = 'person'`. Same response shape
      as founders, with company associations, education, and tags.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Founders
    definition: Founder profiles with company associations and education history. Subset of entities where `is_founder = true`.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: News
    definition: Curated news articles about companies, funds, deals, sectors, and events.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Jobs
    definition: Active job openings posted by companies, with hiring-trend signals.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Aggregate
    definition: Composable single- and multi-metric aggregations across companies, universities, government bodies and NGOs, funding rounds, valuations,
      founders, investors, and entities of every type.
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Timeseries
    definition: Yearly entity metrics (employees, revenue, valuation).
    tags:
    - Resource Group
    source: openapi/_original/dealroom-api-openapi.yml
  - term: Filters
    definition: Filter registry discovery and value lookup. Use `/reference/filters` to discover available filters per scope and `/reference/filters/:key/values`
